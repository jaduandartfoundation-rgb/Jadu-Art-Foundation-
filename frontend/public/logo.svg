<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="fullGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F36" />
      <stop offset="100%" stop-color="#006B3C" />
    </linearGradient>
    <linearGradient id="fullOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F47B20" />
      <stop offset="100%" stop-color="#E05D00" />
    </linearGradient>
    <linearGradient id="fullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5AA30" />
      <stop offset="100%" stop-color="#C99020" />
    </linearGradient>
  </defs>

  <!-- Central Emblem -->
  <g transform="translate(150, 15)">
    <circle cx="50" cy="50" r="46" fill="url(#fullGreenGrad)" />
    <circle cx="50" cy="50" r="44" stroke="#C99020" stroke-width="1.5" fill="none" opacity="0.6" />
    <circle cx="50" cy="34" r="11" fill="url(#fullGoldGrad)" />
    <path d="M 50 68 C 30 68 22 48 34 32 C 38 46 46 56 50 68 Z" fill="url(#fullOrangeGrad)" />
    <path d="M 50 68 C 70 68 78 48 66 32 C 62 46 54 56 50 68 Z" fill="url(#fullOrangeGrad)" opacity="0.9" />
    <path d="M 50 64 C 44 50 45 36 50 24 C 55 36 56 50 50 64 Z" fill="url(#fullGoldGrad)" />
    <path d="M 24 50 C 26 66 36 78 50 78 C 64 78 74 66 76 50 C 66 60 58 64 50 64 C 42 64 34 60 24 50 Z" fill="#006B3C" />
  </g>

  <!-- Title: JADU AND ART -->
  <text x="200" y="148" font-family="'Outfit', 'Inter', serif" font-weight="900" font-size="28" letter-spacing="2" fill="#063F36" text-anchor="middle">
    JADU AND ART
  </text>

  <!-- Subtitle: FOUNDATION -->
  <text x="200" y="176" font-family="'Inter', sans-serif" font-weight="800" font-size="18" letter-spacing="6" fill="#006B3C" text-anchor="middle">
    FOUNDATION
  </text>

  <!-- Gold Decorative Line -->
  <line x1="100" y1="190" x2="300" y2="190" stroke="#C99020" stroke-width="1.5" opacity="0.6" />
  <circle cx="200" cy="190" r="3" fill="#F47B20" />

  <!-- Tagline 1: Spiritual Values | Social Impact | A Brighter India -->
  <text x="200" y="214" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="0.5" fill="#063F36" text-anchor="middle">
    Spiritual Values  |  Social Impact  |  A Brighter India
  </text>

  <!-- Tagline 2: Seva • Sanskar • Samriddh Bharat -->
  <rect x="70" y="232" width="260" height="30" rx="15" fill="#FBF8F1" stroke="#E4E9E5" stroke-width="1" />
  <text x="200" y="252" font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1" fill="#F47B20" text-anchor="middle">
    Seva • Sanskar • Samriddh Bharat
  </text>
</svg>
